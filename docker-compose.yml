# Local/single-machine deployment -- Postgres + the API (which applies its
# own migrations on start, see docker-entrypoint.sh) + the frontend served
# by nginx. Not Kubernetes-shaped on purpose: this is a single-instance
# project, not a fleet, see CLAUDE.md's Infrastructure section.
#
# Usage:
#   docker compose up --build
#   docker compose exec api python run_all.py        # first time: train models + recommendations
#   docker compose exec api python sync_run_to_db.py  # load that run into Postgres
# Then: API at http://localhost:8000, frontend at http://localhost:3000.
#
# POSTGRES_PASSWORD below is a placeholder for local use only -- override
# it (and DATABASE_URL to match) via a .env file or real secrets for
# anything beyond a laptop.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: credit_line_manager
      POSTGRES_USER: credit_line_manager
      POSTGRES_PASSWORD: credit_line_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_line_manager -d credit_line_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://credit_line_manager:credit_line_manager@postgres:5432/credit_line_manager
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5180
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      # Bind-mounted (not baked into the image) so `docker compose exec api
      # python run_all.py` output lands on the host and survives container
      # rebuilds, same files a non-Docker run would produce.
      - ./models:/app/models
      - ./data/processed:/app/data/processed
      - ./reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
