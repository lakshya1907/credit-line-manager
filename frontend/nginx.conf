# SPA fallback: any path that isn't a real static file serves index.html
# so React Router's client-side routes (e.g. /runs/<id>) work on a hard
# refresh or a direct link, not just client-side navigation.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
